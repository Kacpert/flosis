function css(str){
  const o = {};
  String(str).split(';').forEach(d => {
    const i = d.indexOf(':'); if (i < 0) return;
    const k = d.slice(0, i).trim(); if (!k) return;
    const v = d.slice(i + 1).trim();
    const ck = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    o[ck] = v;
  });
  return o;
}

function TrendChart({ points, series, height, mode }){
  const bar = mode==='bar';
  const W=980, H=height||220, padL=38, padR=16, padT=16, padB=28;
  const n=points.length;
  const allVals=[]; series.forEach(s=>points.forEach(p=>allVals.push(p[s.key])));
  const maxV=Math.max(1,...allVals), max=Math.ceil(maxV/10)*10 || maxV;

  const y=v=> padT + ih - (v/max)*ih;
  const gap=Math.min(6,band*0.18);

  const [hover,setHover]=React.useState(-1);
  const ticks=4; const gy=[]; for(let t=0;t<=ticks;t++){ gy.push(Math.round(max*t/ticks)); }

  return (
    <div style={{position:'relative',width:'100%'}}>
      <svg viewBox={'0 0 '+W+' '+H} preserveAspectRatio="none" style={{width:'100%',height:H+'px',display:'block'}}
        onMouseLeave={()=>setHover(-1)}
        onMouseMove={e=>{ const r=e.currentTarget.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width*W; let bi=0,bd=1e9; for(let i=0;i<n;i++){ const d=Math.abs(x(i)-px); if(d<bd){bd=d;bi=i;} } setHover(bi); }}>
        {gy.map((v,i)=>(<g key={i}><line x1={padL} x2={W-padR} y1={y(v)} y2={y(v)} stroke="var(--border)" strokeWidth="1"/><text x={padL-8} y={y(v)+4} textAnchor="end" fontSize="10" fill="var(--faint)">{v}</text></g>))}
        {points.map((p,i)=> (i%step===0||i===n-1) ? <text key={i} x={x(i)} y={H-8} textAnchor="middle" fontSize="10" fill="var(--faint)">{p.label}</text> : null)}
        {bar && hover>=0 && <rect x={padL+hover*band} y={padT} width={band} height={ih} fill="var(--faint)" opacity=".07"/>}
        {series.map((s,si)=>{
          if(bar){
            return (<g key={si}>{points.map((p,i)=>{ const v=p[s.key]; const h=Math.max(0,(v/max)*ih); const bx=padL+i*band+gap/2+si*bw; return (<rect key={i} x={bx} y={padT+ih-h} width={bw} height={h} rx="2" fill={s.color} opacity={hover<0||hover===i?1:.45}/>); })}</g>);
          }
          const dPath=points.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p[s.key])).join(' ');
          const aPath=dPath+' L'+x(n-1)+' '+(padT+ih)+' L'+x(0)+' '+(padT+ih)+' Z';
          return (<g key={si}>
            {s.fill && <path d={aPath} fill={s.color} opacity="0.08"/>}
            <path d={dPath} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
            {points.map((p,i)=>(<circle key={i} cx={x(i)} cy={y(p[s.key])} r={hover===i?4:0} fill={s.color}/>))}
          </g>);
        })}
        {!bar && hover>=0 && <line x1={x(hover)} x2={x(hover)} y1={padT} y2={padT+ih} stroke="var(--faint)" strokeWidth="1" strokeDasharray="3 3"/>}
      </svg>
      {hover>=0 && (
        <div style={{position:'absolute',top:0,left:'calc('+((x(hover)/W)*100)+'% )',transform:'translateX(-50%)',pointerEvents:'none',background:'var(--text)',color:'var(--bg)',borderRadius:'8px',padding:'7px 10px',fontSize:'11px',whiteSpace:'nowrap',boxShadow:'var(--shadow-lg)'}}>
          <div style={{fontWeight:700,marginBottom:'3px'}}>{points[hover].full}</div>
          {series.map((s,i)=>(<div key={i} style={{display:'flex',alignItems:'center',gap:'6px'}}><span style={{width:'7px',height:'7px',borderRadius:'50%',background:s.color}}></span>{s.label}: <b>{points[hover][s.key]}</b></div>))}
        </div>
      )}
    </div>
  );
}

function buildTrend(){
  const months=[], sprints=[];
  let d=new Date(2024,8,1);
  const spBase=[52,58,61,55,64,60,68,63,71,66,74,70,72,69,77,73,80,76,82,79,85,81,87,84];
  const bugC=[14,11,13,16,10,12,15,9,13,8,11,14,10,12,9,13,8,11,10,12,9,13,11,12];
  const bugF=[10,12,11,13,12,14,12,11,13,12,14,13,12,13,11,14,12,13,12,14,13,15,13,14];
  for(let i=0;i<24;i++){
    const m=d.getMonth(), y=d.getFullYear();
    months.push({ label:MONTH_NAMES[m]+' '+String(y).slice(2), full:MONTH_NAMES[m]+' '+y, sp:spBase[i], bugsCreated:bugC[i], bugsFixed:bugF[i] });
    d.setMonth(d.getMonth()+1);
  }
  let sp=48;
  for(let i=0;i<26;i++){
    const n=76+i;
    sp += Math.round((Math.sin(i/2)*4)+(i%4===0?5:2)-(i%7===0?6:0));
    sprints.push({ label:'S'+n, full:'Sprint '+n, sp:Math.max(28,sp), bugsCreated:4+Math.round(Math.abs(Math.sin(i))*4)+(i%5===0?3:0), bugsFixed:4+Math.round(Math.abs(Math.cos(i))*3)+(i%3===0?2:0) });
  }
  const weeks=[]; let wsp=9;
  for(let i=0;i<104;i++){
    wsp += Math.round(Math.sin(i/3)*2 + (i%5===0?2:0) - (i%9===0?2:0));
    const dt=new Date(2024,7,5); dt.setDate(dt.getDate()+i*7);
    const lb=MONTH_NAMES[dt.getMonth()]+' '+dt.getDate();
    weeks.push({ label:lb, full:'Week of '+lb+', '+dt.getFullYear(), sp:Math.max(4,wsp), bugsCreated:1+Math.round(Math.abs(Math.sin(i))*3), bugsFixed:1+Math.round(Math.abs(Math.cos(i))*3) });
  }
  const fortnights=[];
  for(let i=0;i<52;i++){
    const a=weeks[i*2], b=weeks[i*2+1]; if(!a||!b) break;
    fortnights.push({ label:a.label, full:a.full.replace('Week of','Fortnight of'), sp:a.sp+b.sp, bugsCreated:a.bugsCreated+b.bugsCreated, bugsFixed:a.bugsFixed+b.bugsFixed });
  }
  return { months, sprints, weeks, fortnights };
}

function DsFit({ w, children }){
  const outer = useRef(null), inner = useRef(null);
  const [s,setS] = useState(1); const [ih,setIh] = useState(0);
  React.useEffect(()=>{
    const upd = ()=>{ if(outer.current) setS(Math.min(1, outer.current.clientWidth / w)); if(inner.current) setIh(inner.current.offsetHeight); };
    const ro = new ResizeObserver(upd);
    if(outer.current) ro.observe(outer.current); if(inner.current) ro.observe(inner.current);
    upd(); return ()=>ro.disconnect();
  }, [w]);
  return (<div ref={outer} style={css('width:100%;overflow:hidden;height:'+(ih ? Math.ceil(ih*s)+'px' : 'auto'))}><div ref={inner} style={css('width:'+w+'px;transform:scale('+s+');transform-origin:top left')}>{children}</div></div>);
}

  if(!cfg || setupEdit){

        <div style={css('flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0')}>

            <div style={css('position:relative;margin-bottom:16px')}>
              <input type={showPass?'text':'password'} value={loginPass} onChange={e=>{setLoginPass(e.target.value); if(loginErr) setLoginErr('');}} placeholder="••••••••" style={css('width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 42px 11px 13px;outline:none')}/>
              <button type="button" onClick={()=>setShowPass(s=>!s)} title={showPass?'Hide password':'Show password'} style={css('position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:7px;border:none;background:none;cursor:pointer;color:var(--faint);display:flex;align-items:center;justify-content:center')}>
                {showPass ? I('<path d="M17.94 17.94A10.1 10.1 0 0 1 12 20C5 20 1 12 1 12a18.4 18.4 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/>',16) : I('<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',16)}
              </button>
            </div>

            {loginErr && <div style={css('display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--danger);background:var(--danger-soft);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:14px')}>{I('<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',14)}{loginErr}</div>}

            <label style={css('display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:20px')}>
              <span onClick={()=>setRemember(r=>!r)} style={css('width:17px;height:17px;flex:0 0 17px;border-radius:5px;border:1.5px solid '+(remember?'var(--primary)':'var(--border)')+';background:'+(remember?'var(--primary)':'transparent')+';display:flex;align-items:center;justify-content:center;color:#fff')}>{remember && I('<path d="M20 6L9 17l-5-5"/>',11)}</span>

            <button type="submit" disabled={loginBusy} style={css('width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:650;font-size:14px;border-radius:10px;padding:12px;border:none;color:#fff;background:var(--primary);cursor:'+(loginBusy?'default':'pointer')+';opacity:'+(loginBusy?'.7':'1'))}>

            <div style={css('display:flex;align-items:center;gap:10px;margin:20px 0')}>

            <p style={css('margin:22px 0 0;font-size:12.5px;color:var(--faint);text-align:center')}>No account? <a href="#" onClick={e=>{e.preventDefault();}} style={css('color:var(--primary);font-weight:600;text-decoration:none')}>Ask your administrator</a></p>

        <div style={css('font-size:11.5px;color:var(--faint)')}>flosis.com · Administrator &amp; Product Owner access</div>

      {/* right: brand panel */}
      <div style={css('flex:0 0 46%;min-width:0;background:var(--surface);border-left:1px solid var(--border);padding:44px;display:flex;overflow-y:auto')}>
        <div style={css('margin:auto;width:100%;display:flex;flex-direction:column;gap:26px')}>
        <div>
          <div style={css('font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--ai)')}>FROM ROUGH IDEAS TO READY TICKETS</div>
          <h2 style={css('margin:12px 0 0;font-size:29px;font-weight:700;letter-spacing:-.9px;line-height:1.25;color:var(--text)')}>An AI teammate that reads your code before it asks anything.</h2>
        </div>
        <div style={css('display:flex;flex-direction:column;gap:12px')}>
          {[
            ['Briefing &amp; Details Gathering','Turns a one-line idea into an implementation-ready Jira description.','<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>'],
            ['Scheduled agents with memory','Prompt-driven automations that remember what they already reported, so you only hear what changed.','<path d="M12 2a5 5 0 0 1 5 5v1a4 4 0 0 1 0 8v1a5 5 0 0 1-10 0v-1a4 4 0 0 1 0-8V7a5 5 0 0 1 5-5zM12 2v20"/>'],
            ['Reporting &amp; bug attribution','Throughput, cost and who introduced each bug — with confidence.','<path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="13" y="7" width="3" height="10"/>'],
            ['AI PR reviews &amp; estimates','Comments on every pull request and writes story points to Jira.','<path d="M21 12a9 9 0 1 1-6.2-8.5"/><path d="M21 4v5h-5"/>'],
          ].map((f,i)=>(
            <div key={i} style={css('display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 15px')}>
              <span style={css('width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center')}>{I(f[2],16)}</span>
              <div>
                <div style={css('font-size:13.5px;font-weight:650;color:var(--text)')} dangerouslySetInnerHTML={{__html:f[0]}}></div>
                <div style={css('font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:3px')} dangerouslySetInnerHTML={{__html:f[1]}}></div>
              </div>
            </div>
          ))}
        </div>
        <div style={css('display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint)')}>
          <span style={css('display:inline-flex;align-items:center;gap:6px')}><span style={css('width:7px;height:7px;border-radius:50%;background:var(--ai)')}></span>Claude Opus</span>

  return (
  <div data-theme={theme} style={css('height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden')}>

    {/* TOP BAR */}
    {(!immersive || peekTop) && <header style={css('height:56px;flex:0 0 56px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:40')}>
      <div style={css('display:flex;align-items:center;gap:6px;padding-right:6px')}>
        <svg width="28" height="22" viewBox="0 0 56 44" style={{flex:'0 0 28px'}}><g strokeLinecap="round"><line x1="6" y1="10" x2="22" y2="10" stroke="var(--ai)" strokeWidth="5"/><circle cx="28.4" cy="9.6" r="2.7" fill="var(--mk1)"/><circle cx="34.39" cy="8" r="2.2" fill="var(--mk2)"/><circle cx="38.12" cy="2.68" r="1.7" fill="var(--mk3)"/><line x1="6" y1="21" x2="40" y2="21" stroke="var(--text)" strokeWidth="5" opacity=".85"/><line x1="6" y1="32" x2="30" y2="32" stroke="var(--text)" strokeWidth="5" opacity=".5"/></g></svg>

      </button>
      <button onClick={()=>{setAuthed(false); setLoginPass(''); setLoginErr('');}} title="Sign out" style={css('display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;margin-left:4px;border:none;background:none;cursor:pointer;border-radius:9px;font-family:inherit')}>
        <div style={css('width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--ai));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px')}>AB</div>
        <div style={css('display:flex;flex-direction:column;line-height:1.15')}>
          <span style={css('font-size:12.5px;font-weight:600;color:var(--text)')}>Alex Brandt</span>
          <span style={css('font-size:10.5px;color:var(--faint)')}>Administrator</span>
        </div>
      </button>

    <div style={css('flex:1;display:flex;min-height:0')}>
      {(!immersive || peekNav) && <nav style={css('width:'+(navCollapsed?'64px':'236px')+';flex:0 0 '+(navCollapsed?'64px':'236px')+';background:var(--surface);border-right:1px solid var(--border);padding:14px '+(navCollapsed?'10px':'12px')+';display:flex;flex-direction:column;gap:3px;transition:width .16s ease')}>

          <button onClick={()=>setNavCollapsed(c=>!c)} title={navCollapsed?'Expand menu':'Collapse menu'} style={css('background:none;border:none;cursor:pointer;color:var(--faint);display:flex;padding:4px;border-radius:6px')}>{I(navCollapsed?'<path d="M9 18l6-6-6-6"/>':'<path d="M15 18l-6-6 6-6"/>',16)}</button>

        {NAV.map(n=>(
          <button key={n.key} onClick={()=>goView(n.key)} title={navCollapsed?n.label:''} style={css(navStyle(view===n.key)+(navCollapsed?';justify-content:center;padding:10px 0;position:relative':''))}>
            <span style={css('display:flex;width:18px;height:18px')}>{I(n.icon,18)}</span>

            {n.badge && navCollapsed && <span style={css('position:absolute;top:5px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--primary)')}></span>}
          </button>
        ))}
        <div style={css('flex:1')}></div>
        {!navCollapsed && <div style={css('font-size:10.5px;font-weight:700;letter-spacing:.7px;color:var(--faint);padding:6px 10px 8px')}>ADMIN</div>}
        <button onClick={()=>goView('config')} title={navCollapsed?'Configuration':''} style={css(navStyle(view==='config')+(navCollapsed?';justify-content:center;padding:10px 0':''))}>
          <span style={css('display:flex;width:18px;height:18px')}>{I(CONFIG_ICON,18)}</span>
          {!navCollapsed && <span style={css('flex:1;text-align:left')}>Configuration</span>}
        </button>
        {navCollapsed ? (
          <div title="Claude Opus · master refreshed 2h ago" style={css('margin-top:8px;display:flex;justify-content:center;padding:10px 0')}><span style={css('width:9px;height:9px;border-radius:50%;background:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)')}></span></div>
        ) : (
          <div style={css('margin-top:8px;padding:12px;border-radius:10px;background:var(--ai-soft);border:1px solid var(--border)')}>
            <div style={css('display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--ai)')}><span style={css('width:7px;height:7px;border-radius:50%;background:var(--ai)')}></span>Claude Opus</div>
            <div style={css('font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45')}>Repo checked out · <b style={css('color:var(--text)')}>master</b> refreshed 2h ago</div>
          </div>
        )}
      </nav>}

      {immersive && (()=>{ const nw = peekNav ? (navCollapsed?64:236) : 0; const th = peekTop ? 56 : 0; const tab = 'position:fixed;z-index:46;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;box-shadow:var(--shadow);padding:0;transition:color .15s'; return (<>
        <button className="hovchip" onClick={()=>setPeekTop(p=>!p)} title={peekTop?'Hide top bar':'Show top bar'} style={css(tab+';top:'+th+'px;left:50%;transform:translateX(-50%);width:52px;height:15px;border-top:none;border-radius:0 0 9px 9px')}>{I(peekTop?'<path d="M18 15l-6-6-6 6"/>':'<path d="M6 9l6 6 6-6"/>',13)}</button>
        <button className="hovchip" onClick={()=>setPeekNav(p=>!p)} title={peekNav?'Hide menu':'Show menu'} style={css(tab+';left:'+nw+'px;top:50%;transform:translateY(-50%);width:15px;height:52px;border-left:none;border-radius:0 9px 9px 0')}>{I(peekNav?'<path d="M15 18l-6-6 6-6"/>':'<path d="M9 6l6 6-6 6"/>',13)}</button>
      </>); })()}

      {/* MAIN */}
      <main style={css('flex:1;min-width:0;overflow-y:auto;background:var(--bg)')}>

          <div style={css('max-width:1560px;margin:0 auto;padding:26px 30px 60px')}>
            <h1 style={css('margin:0;font-size:23px;font-weight:700;letter-spacing:-.5px;color:var(--text)')}>Create Tasks</h1>
            <p style={css('margin:7px 0 22px;color:var(--muted);font-size:14px;line-height:1.5')}>Turn rough ideas and unclear tickets into implementation-ready Jira tasks. The AI reads the repo first, then helps you shape them.</p>
            <div style={css('display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:30px')}>
              {[
                {t:'New idea',d:'Name it first so it’s saved — then talk it through anytime.',ico:'<path d="M12 5v14M5 12h14"/>',c:'primary',go:()=>{setNewIdeaTitle('');setNewIdeaDesc('');setNewIdeaOpen(true);}},
                {t:'Existing Jira task',d:'Browse your Jira boards — design, development, backlog — and pull a ticket in.',ico:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/>',c:'primary',go:()=>{setJiraSearch('');setJiraPickOpen(true);}},

                          <span style={css('width:22px;height:22px;border-radius:50%;background:'+d.c+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex:0 0 22px')}>{initials(d.name)}</span>
                          <span style={css('flex:1;font-size:13px;font-weight:500;color:var(--text)')}>{d.name}</span>

              <div style={css('padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between')}>

              </div>

                <div key={i} className="hovrow" onClick={()=>{setDevReport(d);setDevRepRange(6);}} title="Open developer report" style={css('display:flex;align-items:center;padding:13px 20px;border-bottom:1px solid var(--border);cursor:pointer')}>
                  <span style={css('flex:1;display:flex;align-items:center;gap:10px')}><span style={css('width:28px;height:28px;border-radius:50%;background:'+d.c+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 28px')}>{initials(d.name)}</span><span style={css('font-weight:600;font-size:13.5px;color:var(--text)')}>{d.name}</span></span>
                  <span style={css('width:90px;text-align:right;font-weight:700;font-size:14px;color:var(--text)')}>{d.sp}</span>

              </div>
              <div style={css('display:flex;align-items:center;padding:11px 20px;font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--faint);border-bottom:1px solid var(--border)')}>
                <span style={css('width:74px;flex:0 0 74px')}>KEY</span>
                <span style={css('flex:1')}>FEATURE</span>
                <span style={css('width:150px')}>DELIVERED BY</span>
                <span style={css('width:70px;text-align:right')}>PTS</span>
                <span style={css('width:70px;text-align:right')}>PRS</span>

                  <span style={css('width:70px;text-align:right;font-size:13px;color:var(--muted)')}>{d.prs}</span>
                  <span style={css('width:80px;text-align:right;font-size:12.5px;color:var(--faint)')}>{d.merged}</span>
                </div>

                        <span style={css('width:90px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:'+prColor(c.priority))}><span style={css('width:6px;height:6px;border-radius:50%;background:currentColor')}></span>{c.priority}</span>
                        <span style={css('width:64px;text-align:right;font-size:13px;font-weight:600;color:var(--muted)')}>{c.pts}</span>
                        <span style={css('width:120px;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap')}>{c.reporter}</span>
                      </button>

    {reqDesignOpen && (

          <div style={css('display:flex;gap:9px;justify-content:flex-end')}>
            <button onClick={()=>setReqDesignOpen(false)} style={css('font-family:inherit;font-weight:600;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 16px;cursor:pointer')}>Cancel</button>

        <div onClick={e=>e.stopPropagation()} style={css('width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:80vh')}>

                {briefVersions.map((v,i)=>(<button key={i} onClick={()=>setBriefViewSel(i)} style={css("font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;cursor:pointer;border:1px solid "+(i===briefViewSel?'var(--primary)':'var(--border)')+";background:"+(i===briefViewSel?'var(--primary-soft)':'transparent')+";color:"+(i===briefViewSel?'var(--primary)':'var(--muted)'))}>v{v.n}</button>))}

            </div>
            <button onClick={()=>setBriefViewOpen(false)} style={css('background:none;border:none;cursor:pointer;color:var(--faint);display:flex;padding:4px')}>{I('<path d="M18 6L6 18M6 6l12 12"/>',18)}</button>
          </div>
          <div style={css('flex:1;overflow-y:auto;padding:20px 22px')}>
            {bv && <div style={css('display:flex;align-items:center;gap:8px;margin-bottom:14px')}><span style={css('font-size:11px;color:var(--faint)')}>Brief v{bv.n} · {bv.time}</span><span style={css('font-size:10px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:5px')}>{bv.source}</span></div>}

          </div>
        </div>
      </div>

          </div>
          {ruleNotify && (
            <div style={css('margin-bottom:22px')}>

            <div>
              <h2 style={css('margin:0;font-size:19px;font-weight:700;color:var(--text)')}>{memAlert.name} · memory</h2>
              <p style={css('margin:7px 0 0;font-size:13px;color:var(--muted);line-height:1.5;max-width:520px')}>The AI manages this itself across runs. Read-only — clear it to make the automation rebuild from scratch.</p>
            </div>
            <button onClick={()=>{ setMemCleared(c=>({...c,[memAlert.name]:true})); showToast('Memory cleared · “'+memAlert.name+'”'); }} style={css('flex:0 0 auto;font-family:inherit;font-weight:600;font-size:13px;color:var(--danger);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 16px;cursor:pointer')}>Clear memory</button>
          </div>
          <div style={css('flex:1;overflow-y:auto;padding:20px 24px 24px')}>
            {issues && (
              <div style={css('margin-bottom:22px')}>
                <div style={css('display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--danger);margin-bottom:9px')}>{I('<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>',13)}ISSUES REPORTED BY THE AI</div>
                <div style={css("font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;background:var(--danger-soft);border:1px solid var(--danger);border-radius:12px;padding:16px 18px")}>{issues}</div>
              </div>
            )}
            <div style={css('font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);margin-bottom:9px')}>MEMORY ({cleared?'0 KB':m.kb} / 200 KB)</div>
            <div style={css("font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px 18px")}>{json}</div>
            {cleared && <div style={css('font-size:12.5px;color:var(--muted);margin-top:12px')}>Memory cleared — the automation will rebuild it on its next run.</div>}
          </div>
          <div style={css('padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end')}>
            <button onClick={()=>setMemAlert(null)} style={css('font-family:inherit;font-weight:600;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 18px;cursor:pointer')}>Close</button>
          </div>
        </div>
      </div>
    ); })()}

    {toast && (
      <div style={css('position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:11px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:clarToast .2s ease')}>
        <span style={css('width:18px;height:18px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;flex:0 0 18px;color:#fff')}><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg></span>{toast}
      </div>
    )}
  </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</script>
</body>
