# The workspace_admin flag is Task 5's global privilege check (require_admin!
# reads it directly now, not the role). Mirrors what the backfill migration
# does for a real ADMIN/OWNER row in production — set here by hand since
# fixtures load straight into the test DB and never run that migration.
one_owner:
  user: one
  workspace: one
  role: 2
  time_hr_access: true
  workshop_access: true
  workspace_admin: true

two_employee:
  user: two
  workspace: one
  role: 0
  time_hr_access: true
  workshop_access: false

client_membership:
  user: client_user
  workspace: one
  role: 3
  time_hr_access: false
  workshop_access: false

# A workspace_client whose Time & HR product access is switched ON: full
# Workshop access AND the ability to log their own hours like an employee.
workspace_client_membership:
  user: workspace_client_user
  workspace: one
  role: 4
  time_hr_access: true
  workshop_access: true
