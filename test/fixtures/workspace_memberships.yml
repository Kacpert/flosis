one_owner:
  user: one
  workspace: one
  workspace_admin: true
  time_hr_access: true

two_employee:
  user: two
  workspace: one
  workspace_admin: false
  time_hr_access: true

# Was the Jira-only `client` role: now simply a person holding Tasks and
# nothing else, with no HR account and no workspace privilege — which is what
# makes it a restricted, admin-managed account.
client_membership:
  user: client_user
  workspace: one
  workspace_admin: false
  time_hr_access: false

# Was `workspace_client`: a Product Owner who also logs their own hours.
workspace_client_membership:
  user: workspace_client_user
  workspace: one
  workspace_admin: false
  time_hr_access: true
