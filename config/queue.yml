default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Every job but design turns. solid_queue_recurring is where the recurring
    # command tasks (clear_solid_queue_finished_jobs) run.
    - queues: [ default, mailers, solid_queue_recurring ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # A design turn runs for minutes, so turns have a worker of their own and
    # never hold the threads every other job runs on. A second's wait before
    # one starts does not matter, so this worker polls less often.
    - queues: [ designs ]
      threads: 2
      polling_interval: 1

development:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ default, mailers, solid_queue_recurring ]
      threads: 3
      polling_interval: 0.1
    - queues: [ designs ]
      threads: 2
      polling_interval: 1

test:
  <<: *default

production:
  <<: *default
