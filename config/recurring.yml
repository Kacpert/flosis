#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  jira_sync:
    class: JiraSyncJob
    schedule: every 15 minutes
  holiday_yearly_grant:
    class: HolidayYearlyGrantJob
    schedule: "0 0 1 1 *"
  # Solid Queue evaluates these in the app time zone, which is UTC. CEST is
  # UTC+2, so 07:00/13:00 UTC = 09:00/15:00 Polish summer time. (Under winter
  # time CET/UTC+1 these become 08:00/14:00 local until adjusted.)
  discord_time_logging_reminders_morning:
    class: DiscordReminderJob
    schedule: "0 7 * * 1-5"
  discord_time_logging_reminders_afternoon:
    class: DiscordReminderJob
    schedule: "0 13 * * 1-5"
