production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  jira_sync:
    class: JiraSyncJob
    schedule: every 15 minutes
  holiday_yearly_grant:
    class: HolidayYearlyGrantJob
    schedule: "0 0 1 1 *"
  # Evaluated in the app time zone (Warsaw), so these are local hours: 09:00 and
  # 15:00 Polish time, weekdays. Each flagged person's message is then sent at a
  # random offset within 2 hours of the run.
  discord_time_logging_reminders_morning:
    class: DiscordReminderJob
    args: [ "morning" ]
    schedule: "0 9 * * 1-5"
  discord_time_logging_reminders_afternoon:
    class: DiscordReminderJob
    args: [ "afternoon" ]
    schedule: "0 15 * * 1-5"
