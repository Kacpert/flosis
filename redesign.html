function css(str){
  const o = {};
  String(str).split(';').forEach(d => {
    const i = d.indexOf(':'); if (i < 0) return;
    const k = d.slice(0, i).trim(); if (!k) return;
    const v = d.slice(i + 1).trim();
    const ck = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    o[ck] = v;
  });
  return o;
}

function TrendChart({ points, series, height }){

        {gy.map((v,i)=>(<g key={i}><line x1={padL} x2={W-padR} y1={y(v)} y2={y(v)} stroke="var(--border)" strokeWidth="1"/><text x={padL-8} y={y(v)+4} textAnchor="end" fontSize="10" fill="var(--faint)">{v}</text></g>))}
        {points.map((p,i)=> (i%step===0||i===n-1) ? <text key={i} x={x(i)} y={H-8} textAnchor="middle" fontSize="10" fill="var(--faint)">{p.label}</text> : null)}
        {series.map((s,si)=>{
          const dPath=points.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p[s.key])).join(' ');
          const aPath=dPath+' L'+x(n-1)+' '+(padT+ih)+' L'+x(0)+' '+(padT+ih)+' Z';

            {s.fill && <path d={aPath} fill={s.color} opacity="0.08"/>}
            <path d={dPath} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>

          <div style={{fontWeight:700,marginBottom:'3px'}}>{points[hover].full}</div>
          {series.map((s,i)=>(<div key={i} style={{display:'flex',alignItems:'center',gap:'6px'}}><span style={{width:'7px',height:'7px',borderRadius:'50%',background:s.color}}></span>{s.label}: <b>{points[hover][s.key]}</b></div>))}
        </div>
      )}
    </div>
  );
}

function buildTrend(){
  const months=[], sprints=[];
  let d=new Date(2024,6,1);
  const spBase=[52,58,61,55,64,60,68,63,71,66,74,70,72,69,77,73,80,76,82,79,85,81,87,84];
  const bugC=[14,11,13,16,10,12,15,9,13,8,11,14,10,12,9,13,8,11,10,12,9,13,11,12];
  const bugF=[10,12,11,13,12,14,12,11,13,12,14,13,12,13,11,14,12,13,12,14,13,15,13,14];
  for(let i=0;i<24;i++){
    const m=d.getMonth(), y=d.getFullYear();
    months.push({ label:MONTH_NAMES[m]+' '+String(y).slice(2), full:MONTH_NAMES[m]+' '+y, sp:spBase[i], bugsCreated:bugC[i], bugsFixed:bugF[i] });
    d.setMonth(d.getMonth()+1);
  }
  let sp=48;
  for(let i=0;i<26;i++){
    const n=76+i;
    sp += Math.round((Math.sin(i/2)*4)+(i%4===0?5:2)-(i%7===0?6:0));
    sprints.push({ label:'S'+n, full:'Sprint '+n, sp:Math.max(28,sp), bugsCreated:4+Math.round(Math.abs(Math.sin(i))*4)+(i%5===0?3:0), bugsFixed:4+Math.round(Math.abs(Math.cos(i))*3)+(i%3===0?2:0) });
  }
  return { months, sprints };
}

            {CHANNELS.map(c=>{ const on=ruleChannel===c; return (<button key={c} onClick={()=>setRuleChannel(c)} style={css('font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;border:1px solid '+(on?'var(--primary)':'var(--border)')+';background:'+(on?'var(--primary-soft)':'var(--surface)')+';color:'+(on?'var(--primary)':'var(--muted)'))}>{c}</button>); })}
          </div>
          <div style={css('display:flex;gap:9px;justify-content:flex-end')}>
            <button onClick={()=>setRuleOpen(false)} style={css('font-family:inherit;font-weight:600;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 16px;cursor:pointer')}>Cancel</button>
            <button onClick={createRule} disabled={!ruleName.trim()||!rulePrompt.trim()} style={css('display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-weight:650;font-size:13px;border-radius:9px;padding:10px 18px;border:none;'+((ruleName.trim()&&rulePrompt.trim())?'background:var(--primary);color:#fff;cursor:pointer':'background:var(--surface-2);color:var(--faint);cursor:not-allowed'))}>Create rule</button>
          </div>
        </div>
      </div>
    )}

    {manageInt && (
      <div onClick={()=>setManageInt(null)} style={css('position:fixed;inset:0;z-index:55;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:clarFade .12s ease')}>
        <div onClick={e=>e.stopPropagation()} style={css('width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto')}>
          <div style={css('padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:13px')}>
            <span style={css('width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text);flex:0 0 40px')}>{I(manageInt.ico,20)}</span>
            <div style={css('flex:1')}>
              <div style={css('font-weight:700;font-size:16px;color:var(--text)')}>{manageInt.name}</div>
              <div style={css('display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--success);margin-top:2px')}><span style={css('width:6px;height:6px;border-radius:50%;background:currentColor')}></span>{manageInt.status}</div>
            </div>
            <button onClick={()=>setManageInt(null)} style={css('background:none;border:none;cursor:pointer;color:var(--faint);display:flex;padding:4px')}>{I('<path d="M18 6L6 18M6 6l12 12"/>',18)}</button>
          </div>
          <div style={css('padding:20px 22px')}>
            {manageInt.key==='github' && (<div>
              <MField label="REPOSITORY" value="acme/survey-platform" mono hint="The repo is checked out server-side; master is refreshed daily." />
              <MField label="ACCESS TOKEN" value="ghp_••••••••••••a3f1" mono action="Rotate" />
              <MField label="DEFAULT BRANCH" value="master" mono />
              <div style={css('margin-top:6px')}>
                <MToggle label="Auto-refresh master daily" on={true} onToggle={()=>{}} hint="Last refreshed 2h ago" />
                <MToggle label="AI PR reviews on this repo" on={true} onToggle={()=>{}} />
              </div>
            </div>)}
            {manageInt.key==='jira' && (<div>
              <MField label="SITE URL" value="acme.atlassian.net" mono />
              <MField label="PROJECT KEY" value="SP" mono />
              <div style={css('font-size:11.5px;font-weight:700;color:var(--faint);margin-bottom:6px')}>CUSTOM FIELDS</div>
              <div style={css('display:flex;flex-direction:column;gap:7px;margin-bottom:14px')}>
                {[['AI estimation','number'],['AI actions','status']].map(f=>(<div key={f[0]} style={css('display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px')}><span style={css('color:var(--success);display:flex')}>{I('<path d="M20 6L9 17l-5-5"/>',14)}</span><span style={css('font-weight:600;font-size:13px;color:var(--text);flex:1')}>{f[0]}</span><span style={css('font-size:11px;color:var(--faint)')}>{f[1]}</span></div>))}
              </div>
              <MToggle label="MCP access for AI Alerts" on={true} onToggle={()=>{}} hint="Lets AI inspect live board state." />
            </div>)}
            {manageInt.key==='discord' && (<div>
              <div style={css('font-size:11.5px;font-weight:700;color:var(--faint);margin-bottom:6px')}>WEBHOOKS</div>
              <div style={css('display:flex;flex-direction:column;gap:7px;margin-bottom:12px')}>
                {['#dev-alerts','#product'].map(c=>(<div key={c} style={css('display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px')}><span style={css('color:var(--muted);display:flex')}>{I('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',14)}</span><span style={css('font-weight:600;font-size:13px;color:var(--text);flex:1')}>{c}</span><button style={css('font-size:11.5px;font-weight:600;color:var(--faint);background:none;border:none;cursor:pointer')}>Remove</button></div>))}
              </div>
              <button style={css('font-family:inherit;font-size:12.5px;font-weight:600;color:var(--primary);background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px')}>+ Add webhook</button>
              <div style={css('font-size:11.5px;font-weight:700;color:var(--faint);margin-bottom:8px')}>OTHER CHANNELS</div>
              <div style={css('display:flex;gap:8px')}>
                {['Slack','Microsoft Teams'].map(c=>(<div key={c} style={css('flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border:1px dashed var(--border);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--faint)')}>{c}<span style={css('font-size:10px;font-weight:700;background:var(--border);color:var(--muted);padding:2px 6px;border-radius:5px')}>SOON</span></div>))}
              </div>
            </div>)}
            {manageInt.key==='figma' && (<div>
              <MField label="ACCESS TOKEN" value="figd_••••••••••7c21" mono action="Rotate" />
              <MField label="TEAM / PROJECT" value="Survey Platform · Insights" hint="Read-only. Used so the AI can read frames referenced in Details Gathering." />
              <MToggle label="Read designs in Details Gathering" on={true} onToggle={()=>{}} />
            </div>)}
          </div>
          <div style={css('padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:9px')}>
            <button onClick={()=>{ setManageInt(null); showToast('Testing '+manageInt.name+' connection…'); }} style={css('font-family:inherit;font-weight:600;font-size:12.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 14px;cursor:pointer')}>Test connection</button>
            <div style={css('display:flex;gap:9px')}>
              <button onClick={()=>setManageInt(null)} style={css('font-family:inherit;font-weight:600;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 16px;cursor:pointer')}>Cancel</button>
              <button onClick={()=>{ const n=manageInt.name; setManageInt(null); showToast(n+' settings saved'); }} style={css('font-family:inherit;font-weight:650;font-size:13px;color:#fff;background:var(--primary);border:none;border-radius:9px;padding:9px 18px;cursor:pointer')}>Save changes</button>
            </div>
          </div>
        </div>
      </div>
    )}

    {historyAlert && (()=>{ const hist=ALERT_HISTORY[historyAlert.name]||[{time:historyAlert.time||'—',fired:/sent/i.test(historyAlert.last||''),summary:historyAlert.last||'Not run yet',detail:''}]; const fires=hist.filter(h=>h.fired).length; return (
      <div onClick={()=>setHistoryAlert(null)} style={css('position:fixed;inset:0;z-index:55;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:clarFade .12s ease')}>
        <div onClick={e=>e.stopPropagation()} style={css('width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);max-height:86vh;display:flex;flex-direction:column')}>
          <div style={css('padding:20px 22px;border-bottom:1px solid var(--border)')}>
            <div style={css('display:flex;align-items:flex-start;justify-content:space-between;gap:12px')}>
              <div>
                <div style={css('font-weight:700;font-size:17px;color:var(--text)')}>{historyAlert.name}</div>
                <div style={css('font-size:12.5px;color:var(--muted);margin-top:4px;font-style:italic')}>“{historyAlert.prompt}”</div>
              </div>
              <button onClick={()=>setHistoryAlert(null)} style={css('background:none;border:none;cursor:pointer;color:var(--faint);display:flex;padding:4px;flex:0 0 auto')}>{I('<path d="M18 6L6 18M6 6l12 12"/>',18)}</button>
            </div>
            <div style={css('display:flex;gap:16px;margin-top:14px;flex-wrap:wrap')}>
              <span style={css('display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)')}>{I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',13)}{historyAlert.schedule}</span>
              <span style={css('display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)')}>{I('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',13)}{historyAlert.channel} · Discord</span>
              <span style={css('font-size:12px;color:var(--faint)')}>Fired {fires} of {hist.length} runs</span>
            </div>
          </div>
          <div style={css('flex:1;overflow-y:auto;padding:8px 22px 18px')}>
            <div style={css('font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--faint);padding:12px 0 6px')}>RUN HISTORY</div>
            {hist.map((h,i)=>(
              <div key={i} style={css('display:flex;gap:12px;padding:12px 0;border-bottom:'+(i<hist.length-1?'1px solid var(--border)':'none'))}>
                <span style={css('flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:1px;background:'+(h.fired?'var(--success-soft)':'var(--surface-2)')+';color:'+(h.fired?'var(--success)':'var(--faint)'))}>{I(h.fired?'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>':'<path d="M20 6L9 17l-5-5"/>',13)}</span>
                <div style={css('flex:1;min-width:0')}>
                  <div style={css('display:flex;align-items:center;justify-content:space-between;gap:10px')}>
                    <span style={css('font-weight:600;font-size:13px;color:var(--text)')}>{h.summary}</span>
                    <span style={css('font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;'+(h.fired?'color:var(--success);background:var(--success-soft)':'color:var(--faint);background:var(--surface-2)'))}>{h.fired?'NOTIFIED':'NO ACTION'}</span>
                  </div>
                  <div style={css('font-size:11.5px;color:var(--faint);margin-top:2px')}>{h.time}</div>
                  {h.detail && <div style={css('font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px')}>{h.detail}</div>}
                </div>
              </div>
            ))}
          </div>
          <div style={css('padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end')}>
            <button onClick={()=>setHistoryAlert(null)} style={css('font-family:inherit;font-weight:600;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 18px;cursor:pointer')}>Close</button>
          </div>
        </div>
      </div>
    ); })()}

    {resetOpen && (
      <div onClick={()=>setResetOpen(false)} style={css('position:fixed;inset:0;z-index:55;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:clarFade .12s ease')}>
        <div onClick={e=>e.stopPropagation()} style={css('width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:22px')}>
          <div style={css('display:flex;align-items:center;justify-content:space-between;margin-bottom:4px')}>
            <h2 style={css('margin:0;font-size:18px;font-weight:700;color:var(--text)')}>Reset AI session</h2>
            <button onClick={()=>setResetOpen(false)} style={css('background:none;border:none;cursor:pointer;color:var(--faint);display:flex;padding:4px')}>{I('<path d="M18 6L6 18M6 6l12 12"/>',18)}</button>
          </div>
          <p style={css('margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.5')}>Restarts this {isBrief?'briefing':'details'} conversation from scratch — the AI re-reads the code. <b style={css('color:var(--text)')}>All saved versions and the description are kept</b>.</p>
          <div style={css('background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:20px')}>
            <div style={css('font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--faint);margin-bottom:5px')}>KEPT · {active.jiraKey?'JIRA DESCRIPTION':'LOCAL DESCRIPTION'}</div>
            <div style={css('font-size:12.5px;color:var(--text);line-height:1.5')}>{(active.jiraKey?active.jiraDesc:active.desc) || <span style={css('color:var(--faint);font-style:italic')}>No description yet</span>}</div>
          </div>
          <div style={css('display:flex;gap:9px;justify-content:flex-end')}>
            <button onClick={()=>setResetOpen(false)} style={css('font-family:inherit;font-weight:600;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 16px;cursor:pointer')}>Cancel</button>
            <button onClick={doReset} style={css('display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-weight:650;font-size:13px;border-radius:9px;padding:10px 18px;border:none;background:var(--ai);color:#fff;cursor:pointer')}>{I('<path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/>',14)}Restart session</button>
          </div>
        </div>
      </div>
    )}

    {toast && (
      <div style={css('position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:11px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:clarToast .2s ease')}>
        <span style={css('width:18px;height:18px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;flex:0 0 18px;color:#fff')}><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg></span>{toast}
      </div>
    )}
  </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, {presets:[['react',{runtime:'classic'}]]}).code;
  (0,eval)(out);
})();
</script>
</body>
</html>
